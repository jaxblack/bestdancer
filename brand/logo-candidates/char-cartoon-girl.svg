<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cartoon Dancer Girl">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1B1030"/>
      <stop offset="100%" stop-color="#0B0B14"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E9A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF2E9A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16E0FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#16E0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16E0FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FF2E9A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2E9A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <ellipse cx="150" cy="170" rx="170" ry="170" fill="url(#glowP)"/>
  <ellipse cx="372" cy="330" rx="180" ry="180" fill="url(#glowC)"/>
  <ellipse cx="256" cy="452" rx="152" ry="30" fill="url(#stage)"/>

  <!-- legs -->
  <g stroke="#FFD3A8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M268 314 L278 382 L284 440"/>
    <path d="M244 314 L232 380 L222 432"/>
  </g>
  <!-- socks -->
  <g stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" fill="none">
    <path d="M281 426 L284 440"/>
    <path d="M226 420 L222 432"/>
  </g>
  <!-- shoes -->
  <ellipse cx="290" cy="446" rx="23" ry="12" fill="#FFFFFF"/>
  <ellipse cx="290" cy="451" rx="23" ry="6" fill="#FFE14D"/>
  <ellipse cx="216" cy="438" rx="21" ry="11" fill="#FFFFFF"/>
  <ellipse cx="216" cy="443" rx="21" ry="5" fill="#FFE14D"/>

  <!-- shorts -->
  <path d="M222 272 L290 272 L296 310 Q296 318 288 318 L262 316 L256 300 L250 316 L224 318 Q216 318 217 310 Z" fill="#FF2E9A"/>

  <!-- left arm (hand on hip), behind torso -->
  <path d="M220 216 L200 252 L232 286" stroke="#FFD3A8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- torso / top -->
  <path d="M218 204 L294 204 Q300 204 299 212 L288 270 Q287 278 279 278 L233 278 Q225 278 224 270 L213 212 Q212 204 218 204 Z" fill="#16E0FF"/>
  <!-- sleeves -->
  <g stroke="#16E0FF" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M292 214 L303 200"/>
    <path d="M220 214 L210 230"/>
  </g>
  <!-- neck -->
  <path d="M248 190 L264 190 L262 208 L250 208 Z" fill="#FFD3A8"/>

  <!-- hair base -->
  <ellipse cx="256" cy="146" rx="58" ry="60" fill="#2E2438"/>
  <!-- buns -->
  <circle cx="200" cy="106" r="26" fill="#2E2438"/>
  <circle cx="312" cy="106" r="26" fill="#2E2438"/>
  <circle cx="200" cy="126" r="9" fill="#FF2E9A"/>
  <circle cx="312" cy="126" r="9" fill="#FF2E9A"/>
  <!-- face -->
  <ellipse cx="256" cy="150" rx="50" ry="54" fill="#FFD3A8"/>
  <!-- ears -->
  <circle cx="208" cy="152" r="9" fill="#FFD3A8"/>
  <circle cx="304" cy="152" r="9" fill="#FFD3A8"/>
  <circle cx="208" cy="162" r="4" fill="#FFE14D"/>
  <circle cx="304" cy="162" r="4" fill="#FFE14D"/>
  <!-- bangs -->
  <path d="M208 150 Q256 102 304 150 Q256 168 208 150 Z" fill="#2E2438"/>
  <!-- eyes -->
  <ellipse cx="238" cy="164" rx="8" ry="10" fill="#FFFFFF"/>
  <ellipse cx="274" cy="164" rx="8" ry="10" fill="#FFFFFF"/>
  <circle cx="239" cy="166" r="5" fill="#2A2233"/>
  <circle cx="275" cy="166" r="5" fill="#2A2233"/>
  <circle cx="241" cy="163" r="2" fill="#FFFFFF"/>
  <circle cx="277" cy="163" r="2" fill="#FFFFFF"/>
  <!-- blush -->
  <ellipse cx="226" cy="180" rx="9" ry="5" fill="#FF7AB0" opacity="0.6"/>
  <ellipse cx="288" cy="180" rx="9" ry="5" fill="#FF7AB0" opacity="0.6"/>
  <!-- smile -->
  <path d="M247 186 Q256 195 265 186" stroke="#B84A6A" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- right arm (peace sign up), front -->
  <path d="M292 216 L330 182 L346 136" stroke="#FFD3A8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="348" cy="130" r="13" fill="#FFD3A8"/>
  <g stroke="#FFD3A8" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M344 124 L340 102"/>
    <path d="M353 124 L359 102"/>
  </g>
  <!-- left hand on hip -->
  <circle cx="233" cy="286" r="11" fill="#FFD3A8"/>

  <!-- sparkles -->
  <path transform="translate(388 150)" d="M0,-16 C2.6,-5 5,-2.6 16,0 C5,2.6 2.6,5 0,16 C-2.6,5 -5,2.6 -16,0 C-5,-2.6 -2.6,-5 0,-16 Z" fill="#FFFFFF"/>
  <path transform="translate(120 300) scale(0.7)" d="M0,-16 C2.6,-5 5,-2.6 16,0 C5,2.6 2.6,5 0,16 C-2.6,5 -5,2.6 -16,0 C-5,-2.6 -2.6,-5 0,-16 Z" fill="#FFE14D"/>
</svg>
