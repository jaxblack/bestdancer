    <rect x="248" y="-60" width="5" height="620" transform="rotate(90 256 236)"/>
    <rect x="248" y="-60" width="5" height="620" transform="rotate(112.5 256 236)"/>
    <rect x="248" y="-60" width="5" height="620" transform="rotate(135 256 236)"/>
